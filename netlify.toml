# Netlify deploy config. When this repo is connected to Netlify, it builds the
# web export and publishes it automatically on every push. HTTPS is provided
# by Netlify, which the in-browser barcode scanner requires.
[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless food-search proxy (USDA + FatSecret). Reachable at
# /.netlify/functions/food-search. Requires USDA_API_KEY and the FatSecret
# client credentials to be set as site environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
